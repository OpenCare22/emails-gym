<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>
  // Set direction before first paint so an Arabic profile never flashes as LTR.
  // The app re-applies this on every language change (lib/i18n.js setLang).
  // i18n-core RTL_LANGS is the runtime source of truth — keep this list in sync.
  try {
    var s = JSON.parse(localStorage.getItem('gym_state_v1') || '{}');
    if (s.theme === 'light' || (s.theme === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches)) {
      document.documentElement.setAttribute('data-theme', 'light');
    }
    var l = s.lang || ((navigator.language || '').slice(0, 2) === 'ar' ? 'ar' : 'en');
    document.documentElement.lang = l;
    document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
  } catch (e) {}
  // Boot watchdog. A chunk this browser cannot parse (1.4.2's regex lookbehind on iOS 15.5 to
  // 16.3) kills the module graph before any of the app runs, and the logo lifted forever. Here,
  // outside the bundle and in plain old syntax, so it still runs then: a script that fails to
  // load or parse, or no app after 10 s, puts the reason and a Reload button where the logo was.
  // English only, as the packs are in the bundle that did not load. lib/boot.js removes #boot
  // (message included) once the app draws, so a slow start that gets there still gets there.
  (function () {
    var shown = false, last = '';
    function fail(title, detail) {
      var b = document.getElementById('boot');
      // Too early for the boot screen (a script in <head>): say it once the page is there.
      if (!b && document.readyState === 'loading') return document.addEventListener('DOMContentLoaded', function () { fail(title, detail); });
      if (shown || !b || b.getAttribute('data-leaving')) return;
      shown = true;
      b.className = 'fail';
      b.removeAttribute('aria-hidden');
      b.setAttribute('role', 'alert');
      b.setAttribute('dir', 'ltr');
      b.innerHTML = '';
      var box = document.createElement('div'), h = document.createElement('p'), p = document.createElement('p');
      h.className = 'h';
      h.textContent = title;
      p.textContent = 'Reloading often helps. If it keeps happening, please send us this:';
      var c = document.createElement('code');
      c.textContent = (detail || 'No error, it just never finished loading.') + ' (' + navigator.userAgent + ')';
      var r = document.createElement('button');
      r.type = 'button';
      r.textContent = 'Reload';
      r.onclick = function () { location.reload(); };
      box.appendChild(h); box.appendChild(p); box.appendChild(c); box.appendChild(r);
      b.appendChild(box);
    }
    window.addEventListener('error', function (e) {
      var t = e && e.target;
      if (t && t.tagName === 'SCRIPT') return fail('Email’s Gym could not start on this browser.', 'Could not load ' + (t.src || 'a script'));
      if (!e || !e.message) return;
      last = e.message + (e.filename ? ' at ' + e.filename.split('/').pop() + ':' + e.lineno : '');
      if (/SyntaxError|Unexpected|Invalid regular expression/i.test(e.message)) fail('Email’s Gym could not start on this browser.', last);
    }, true);
    window.addEventListener('unhandledrejection', function (e) {
      var r = e && e.reason;
      if (r) last = String((r && r.message) || r);
    });
    setTimeout(function () {
      fail(last ? 'Email’s Gym could not start on this browser.' : 'Email’s Gym is taking too long to start.', last);
    }, 10000);
  })();
</script>
<title>Email’s Gym</title>
<meta name="description" content="Private workout tracker for you and your friends">
<meta name="theme-color" content="#0b0d0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Email’s Gym">
<!-- use-credentials: browsers fetch the manifest without cookies, even same-origin; behind an auth
     proxy (Authelia, Cloudflare Access, Teleport…) that fetch is a login redirect and the Home Screen
     icon comes out generic. iOS 26 reads the icon from the manifest, so this is where it shows. -->
<link rel="manifest" href="manifest.json" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<!-- Inter, bundled (public/fonts, OFL: Inter-LICENSE.txt) so no phone calls Google Fonts. Relative
     URLs, like the rest of the head, so the app also works under a sub-path. -->
<link rel="preload" href="fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face{font-family:"Inter";src:url("fonts/InterVariable.woff2") format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
</style>
</head>
<body>
<!-- The boot screen: painted with the HTML, before any script runs, so the gap between the
     native splash and the first real screen is the mark building itself instead of a blank page.
     The Email's Gym slab E on the app's near-black: its three bands slide in, then it breathes
     (lib/boot.js times its exit to that loop on .db). lib/boot.js takes it away the moment the
     app can draw, so it never adds a wait. -->
<style>
  #boot{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;background:#0b0d0c;transition:opacity .22s ease-out}
  #boot.out{opacity:0;pointer-events:none}
  #boot svg{width:96px;height:auto;overflow:visible}
  #boot path{transform-box:fill-box;transform-origin:center;animation:boot-band .34s cubic-bezier(.3,.7,.4,1) both}
  #boot .b2{animation-delay:.12s}
  #boot .b3{animation-delay:.24s}
  #boot .db{animation:boot-breathe 1.25s ease-in-out .75s infinite}
  @keyframes boot-band{from{transform:translateX(-28px);opacity:0}}
  @keyframes boot-breathe{50%{opacity:.6}}
  #boot.fail{place-items:center;padding:24px}
  #boot.fail div{max-width:340px;font:15px/1.4 "Inter",system-ui,-apple-system,sans-serif;color:#f5f7f4;text-align:center}
  #boot.fail .h{font-size:19px;font-weight:600;margin:0 0 8px}
  #boot.fail code{display:block;margin:14px 0 18px;padding:10px;border-radius:12px;background:#161a18;color:#c4cec5;font-size:12px;text-align:left;word-break:break-word;-webkit-user-select:text;user-select:text}
  #boot.fail button{font:inherit;font-weight:600;color:#101510;background:#f5f7f4;border:0;border-radius:12px;min-height:44px;padding:0 28px}
  html[data-theme="light"] #boot{background:#f8f9f7}
  html[data-theme="light"] #boot .db{fill:#161b17}
  html[data-theme="light"] #boot.fail div{color:#161b17}
  html[data-theme="light"] #boot.fail code{background:#f0f2ef;color:#414a43}
  html[data-theme="light"] #boot.fail button{background:#161b17;color:#ffffff}
  @media (prefers-reduced-motion:reduce){
    #boot path{animation:none}
  }
</style>
<div id="boot" aria-hidden="true">
  <svg viewBox="240 290 560 445">
    <g class="db" fill="#f4f6f2" transform="translate(45 0)">
      <path class="b1" d="M409 301 H702 Q718 301 709 317 L665 379 Q656 392 636 392 H353 Q338 392 348 378 L392 316 Q399 301 409 301Z"/>
      <path class="b2" d="M334 466 H650 Q667 466 658 482 L612 547 Q603 560 584 560 H278 Q264 560 273 545 L318 481 Q324 466 334 466Z"/>
      <path class="b3" d="M266 633 H580 Q596 633 586 649 L540 713 Q532 725 514 725 H211 Q196 725 207 710 L251 646 Q257 633 266 633Z"/>
    </g>
  </svg>
</div>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
